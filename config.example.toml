# Copie este arquivo para config.toml e ajuste os valores.

[microsoft]
# Application (client) ID e Directory (tenant) ID do app registrado no
# Microsoft Entra ID (veja o README, seção "Registro do app").
client_id = "00000000-0000-0000-0000-000000000000"
tenant_id = "00000000-0000-0000-0000-000000000000"

[legalone]
# Pasta onde a rotina "Prazos do Mês no L.O." salva a planilha.
pasta = 'C:\Users\Betina\Downloads'
padrao = "Tarefas_Pendentes_LegalOne_*.xlsx"
# A conclusão da tarefa do revisor no L.O. é o D-2 do fatal.
d_menos = 2
# Prazos com fatal vencido há mais de N dias não são mostrados (use --todas).
ignorar_vencidas_ha_dias = 7

[atribuicoes]
# Planilha diária Atribuicoes_AAAA-MM-DD.xlsx (base para os andamentos no L.O.).
pasta = 'C:\Users\Betina\Downloads'
# Texto do andamento. Campos: {providencia} {executor} {lo} {revisor} {revisao} {fatal} {cliente} {processo}
modelo_texto = "Atribuição de prazo – {providencia}. Executor: {executor} (Prazo LO {lo}). Revisor: {revisor} (revisão {revisao}). Prazo fatal: {fatal}."

[planilha]
# Planilha de programação no SharePoint.
host = "charneskiadvogados.sharepoint.com"
site = "/sites/CharneskiAdvogados_Drive2"
arquivo = "JOBS/Programação 2026.xlsx"
# Abas no formato "W41 13102026" (W<n> + data da semana em DDMMAAAA).

[prazos]
# Uma UF para os feriados estaduais (ex.: "RS"). Use "" para só nacionais.
uf = "RS"
# Usadas só quando falta a tarefa correspondente no L.O.:
# Prazo LO (executor) = fatal menos N dias úteis.
antecedencia_lo = 3
# Revisão = fatal menos N dias úteis.
antecedencia_revisao = 1
# Datas extras sem expediente forense (AAAA-MM-DD), ex.: pontos facultativos.
feriados_extras = ["2026-10-28"]

[agenda]
# Quais datas viram compromisso no Outlook: "lo", "revisao", "fatal".
eventos = ["lo", "fatal"]
# Convidar executor e revisor (envia convite por e-mail a eles).
convidar_equipe = false
# Lembrete (minutos antes do início do dia do compromisso).
lembrete_minutos = 1080
categoria = "Prazos"

# Equipe: nome como aparece na planilha -> e-mail.
[equipe]
Pedro = "pedro@charneski.com.br"
Heron = "heron@charneski.com.br"
Tiago = "tiago@charneski.com.br"
Lorenzo = "lorenzo@charneski.com.br"
Danieli = ""
Arthur = ""
